name: Validate and manually deploy GrantScope
on:
  push:
    branches: [main, release/final-demo]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy reviewed final-demo artifact to Production
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app.py modules services research_foundation
      - run: |
          mkdir -p release/data
          cp app.py requirements.txt startup.sh release/
          cp -R modules services research_foundation release/
          find release -type d -name __pycache__ -prune -exec rm -r {} +
          cp data/agency_strategic_plans.json release/data/
      - uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release/
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/release/final-demo'
    needs: build
    runs-on: ubuntu-latest
    environment: final-demo
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-app
      - uses: azure/webapps-deploy@v3
        with:
          app-name: grantscope-team07
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FBC12AA9C7104497B4BAC8A3F8DE7A72 }}
